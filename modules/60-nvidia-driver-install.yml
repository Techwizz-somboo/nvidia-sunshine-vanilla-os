name: nvidia-official-driver
type: shell
commands:
- apt-mark hold nvidia-driver nvidia-driver-cuda nvidia-kernel-dkms nvidia-settings nvidia-xconfig nvidia-container-toolkit
- rm -f /var/lib/dkms/mok.key

modules:
- name: install-nvidia
  type: shell
  commands:
  # Pinned to the 580 branch (not nvidia-open/cuda-drivers, which float to the newest available
  # version): NVIDIA dropped Maxwell/Pascal/Volta support starting at driver 590, so anything
  # newer won't recognize a GTX 1080. 580.178.04 is the last point release on the last branch
  # that still supports it. Also using the closed kernel module (nvidia-kernel-dkms), not
  # nvidia-kernel-open-dkms - the open kernel modules never supported Pascal at all.
  #
  # Every package below is also named explicitly, not just the 6 top-level ones: apt's solver
  # refuses to auto-select any package as a transitive dependency from this repo (confirmed by
  # watching the "not selected for install" error move one dependency further down the chain each
  # time one got named explicitly), even though it happily selects anything named directly on the
  # command line. This full list is the closure of every dependency, direct or transitive, that's
  # reachable from the 6 top-level packages plus nvidia-container-toolkit and isn't otherwise
  # available from the base's own trusted repo - traced programmatically from the CUDA repo's own
  # Packages file rather than by hand. Most are pinned to the 580.178.04/1.18.2 branch; a handful
  # (libnvidia-egl-gbm1/xcb1/xlib1) are small helper libs versioned independently of the driver
  # branch, so those are pinned to their own latest instead.
  - apt-get install -y nvidia-driver=580.178.04-1 nvidia-driver-cuda=580.178.04-1 nvidia-kernel-dkms=580.178.04-1 nvidia-settings=580.178.04-1 nvidia-xconfig=580.178.04-1 nvidia-opencl-icd=580.178.04-1 nvidia-container-toolkit=1.18.2-1 firmware-nvidia-gsp=580.178.04-1 libcuda1=580.178.04-1 libcudadebugger1=580.178.04-1 libegl-nvidia0=580.178.04-1 libgles-nvidia1=580.178.04-1 libgles-nvidia2=580.178.04-1 libglx-nvidia0=580.178.04-1 libnvcuvid1=580.178.04-1 libnvidia-allocator1=580.178.04-1 libnvidia-api1=580.178.04-1 libnvidia-cfg1=580.178.04-1 libnvidia-container-tools=1.18.2-1 libnvidia-container1=1.18.2-1 libnvidia-egl-gbm1=1.1.3-1 libnvidia-egl-xcb1=1:1.0.5-1 libnvidia-egl-xlib1=1:1.0.5-1 libnvidia-eglcore=580.178.04-1 libnvidia-encode1=580.178.04-1 libnvidia-fbc1=580.178.04-1 libnvidia-glcore=580.178.04-1 libnvidia-glvkspirv=580.178.04-1 libnvidia-gpucomp=580.178.04-1 libnvidia-ml1=580.178.04-1 libnvidia-ngx1=580.178.04-1 libnvidia-nvvm4=580.178.04-1 libnvidia-nvvm704=580.178.04-1 libnvidia-opticalflow1=580.178.04-1 libnvidia-pkcs11-openssl3=580.178.04-1 libnvidia-present=580.178.04-1 libnvidia-ptxjitcompiler1=580.178.04-1 libnvidia-rtcore=580.178.04-1 libnvidia-sandboxutils=580.178.04-1 libnvidia-vksc-core=580.178.04-1 libnvoptix1=580.178.04-1 libxnvctrl0=580.178.04-1 nvidia-container-toolkit-base=1.18.2-1 nvidia-driver-libs=580.178.04-1 nvidia-egl-icd=580.178.04-1 nvidia-kernel-support=580.178.04-1 nvidia-modprobe=580.178.04-1 nvidia-persistenced=580.178.04-1 nvidia-vdpau-driver=580.178.04-1 nvidia-vulkan-icd=580.178.04-1 xserver-xorg-video-nvidia=580.178.04-1
  modules:
    - name: nvidia-official-repo
      type: shell
      sources:
        - type: file
          # Deliberately the debian12 (bookworm) repo, not debian13/trixie: NVIDIA never published
          # the 580 branch to the trixie repo, which starts at 590 (Pascal already dropped). The
          # driver packages themselves aren't tied tightly to the Debian point release.
          url: https://developer.download.nvidia.com/compute/cuda/repos/debian12/x86_64/cuda-keyring_1.1-1_all.deb
          checksum: e7f219eab6fe4819cdb5c15b98233dc3420302d9c00883219cd3d896857cf48d
      commands:
        # NVIDIA's cuda-archive-keyring signing key (same one across every Debian/Ubuntu CUDA repo
        # they publish) has a SHA1-based self-certification, which trixie's sqv rejects outright as
        # of the Debian-wide 2026-02-01 SHA1 deprecation - a known, widely-hit issue (not specific
        # to this repo or to using debian12's path over debian13's; same key, same problem either
        # way). [trusted=yes]/--allow-unauthenticated don't actually work around it since the new
        # apt solver excludes candidates from a repo whose Release failed verification outright
        # rather than just warning. The real fix is relaxing the SHA1 cutoff via apt's sequoia
        # policy config, which turns the rejection back into a warning and lets the repo verify
        # and solve normally.
        - mkdir -p /etc/crypto-policies/back-ends
        - cp /usr/share/apt/default-sequoia.config /etc/crypto-policies/back-ends/apt-sequoia.config
        - sed -i 's/^sha1\.second_preimage_resistance.*/sha1.second_preimage_resistance = 2027-01-01/' /etc/crypto-policies/back-ends/apt-sequoia.config
        - dpkg -i /sources/nvidia-official-repo/cuda-keyring_1.1-1_all/nvidia-official-repo.deb
        - apt-get update
