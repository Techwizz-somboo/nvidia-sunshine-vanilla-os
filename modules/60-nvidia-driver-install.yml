name: nvidia-official-driver
type: shell
commands:
- apt-mark hold nvidia-driver nvidia-driver-cuda nvidia-kernel-dkms nvidia-settings nvidia-xconfig nvidia-container-toolkit
- rm -f /var/lib/dkms/mok.key

modules:
- name: install-nvidia
  type: shell
  commands:
  # Pinned to the 580 branch (not nvidia-open/cuda-drivers, which float to the newest available
  # version): NVIDIA dropped Maxwell/Pascal/Volta support starting at driver 590, so anything
  # newer won't recognize a GTX 1080. 580.178.04 is the last point release on the last branch
  # that still supports it. Also using the closed kernel module (nvidia-kernel-dkms), not
  # nvidia-kernel-open-dkms - the open kernel modules never supported Pascal at all.
  #
  # --allow-unauthenticated: the built-in apt module type has no way to pass this, but it's
  # required here - [trusted=yes] on the source line lets `apt-get update` itself succeed despite
  # NVIDIA's key failing trixie's signature policy, but apt's solver still won't pull in this
  # repo's *transitive* dependencies (nvidia-opencl-icd, nvidia-container-toolkit-base, etc.)
  # without this flag, even though the explicitly-named top-level packages install fine either way.
  - apt-get install -y --allow-unauthenticated nvidia-driver=580.178.04-1 nvidia-driver-cuda=580.178.04-1 nvidia-kernel-dkms=580.178.04-1 nvidia-settings=580.178.04-1 nvidia-xconfig=580.178.04-1 nvidia-container-toolkit
  modules:
    - name: nvidia-official-repo
      type: shell
      commands:
        # Deliberately the debian12 (bookworm) repo, not debian13/trixie: NVIDIA never published
        # the 580 branch to the trixie repo, which starts at 590 (Pascal already dropped). The
        # driver packages themselves aren't tied tightly to the Debian point release.
        #
        # [trusted=yes] instead of the usual signed-by keyring: NVIDIA's cuda-archive-keyring key
        # (EB693B3035CD5710E231E123A4B469963BF863CC, the same one across every Debian/Ubuntu CUDA
        # repo they publish) has a SHA1-based self-certification that trixie's apt now rejects
        # outright (SHA1 deprecated since 2026-02-01). Same problem on debian13's repo - not
        # specific to using debian12's. NVIDIA hasn't reissued the key, so verification is skipped
        # for just this one repo rather than weakening apt's policy globally.
        - printf 'deb [trusted=yes] https://developer.download.nvidia.com/compute/cuda/repos/debian12/x86_64/ /\n' > /etc/apt/sources.list.d/cuda-debian12-x86_64.list
        - apt-get update
